name: FX Monitor initial NY17 history
on:
  workflow_dispatch:
    inputs:
      repair:
        description: Recheck the first unresolved NY17 session per pair
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: fx-monitor-collection
  cancel-in-progress: false
jobs:
  backfill:
    if: github.repository == 'nyancoworks/fx-monitor' && github.ref == 'refs/heads/main' && vars.FX_COLLECTION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: code
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: nyancoworks/fx-monitor-data
          token: ${{ secrets.FX_DATA_REPO_TOKEN }}
          path: private-state
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r code/requirements.txt
      - name: Restore private archive
        env:
          PYTHONPATH: ${{ github.workspace }}/code
        run: python -m fx_system.private_runtime restore --state "$GITHUB_WORKSPACE/private-state"
      - name: Acquire and publish initial history
        env:
          PYTHONPATH: ${{ github.workspace }}/code
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          FX_HISTORY_REPAIR: ${{ inputs.repair }}
        run: |
          args=()
          if [[ "$FX_HISTORY_REPAIR" == true ]]; then args+=(--repair); fi
          python -m fx_system.ny_history_backfill --state "$GITHUB_WORKSPACE/private-state" "${args[@]}"
